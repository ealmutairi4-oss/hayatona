# مثال إعداد Nginx أمام التطبيق (HTTPS إلزامي)
# استبدل bio-age.example.com ومسارات الشهادات بقيم الجهة.

server {
    listen 80;
    server_name bio-age.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bio-age.example.com;

    ssl_certificate     /etc/ssl/certs/bio-age.crt;
    ssl_certificate_key /etc/ssl/private/bio-age.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16k;

    # تقييد لوحة الإدارة على شبكة الجهة (اختياري ويُنصح به)
    # location /admin { allow 10.0.0.0/8; deny all; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    # location /api/admin { allow 10.0.0.0/8; deny all; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
