# إعداد النشر على Render (Blueprint)
# Render ← New ← Blueprint ← اختر هذا المستودع. سيُطلب منك إدخال ADMIN_PASSWORD.
services:
  - type: web
    name: biological-age
    runtime: node
    region: frankfurt          # الأقرب إلى السعودية بين مناطق Render
    plan: starter              # الخطة المدفوعة مطلوبة للقرص الدائم (حفظ قاعدة البيانات)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DB_FILE
        value: /var/data/biological-age.db
      - key: RETENTION_DAYS
        value: "0"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # تُدخلها بنفسك في Render (12 حرفًا على الأقل) — لا تُحفظ في الكود
