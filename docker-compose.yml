services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_FILE: /data/biological-age.db
    volumes:
      - app-data:/data
      - ./backups:/backups
    # يُنشر على المنفذ المحلي فقط؛ يتولى Nginx الوصول الخارجي عبر HTTPS
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  app-data:
